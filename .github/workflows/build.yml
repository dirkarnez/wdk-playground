name: C/C++ CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v6

    - name: Set up MSVC Developer Command Prompt
      uses: ilammy/msvc-dev-cmd@v1.13.0

    - name: Build 
      run: |
        mkdir build
        cd build
        cmake -G Ninja ..
        cmake --build . --config Debug --target simple
        
    - run: |
        dir /S


